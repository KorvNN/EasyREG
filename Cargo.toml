[package]
name = "easyreg"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[workspace]
resolver = "2"
members = [
    "crates/easyreg-semantics",
    "crates/easyreg-core",
    "crates/easyreg-detectors",
    "crates/easyreg-dialects",
    "crates/easyreg-engine",
    "crates/easyreg-inference",
    "crates/easyreg-validation",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["EasyREG contributors"]

[workspace.dependencies]
axum = { version = "0.8", features = ["json"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dependencies]
axum.workspace = true
easyreg-core = { path = "crates/easyreg-core" }
easyreg-engine = { path = "crates/easyreg-engine" }
easyreg-semantics = { path = "crates/easyreg-semantics" }
serde.workspace = true
tokio.workspace = true

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
